<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a869a"/>
    </marker>
    <linearGradient id="gFrontend" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f7fd"/><stop offset="100%" stop-color="#e4eefb"/>
    </linearGradient>
    <linearGradient id="gBackend" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eefaf4"/><stop offset="100%" stop-color="#dcf3e9"/>
    </linearGradient>
    <linearGradient id="gAgent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf3ec"/><stop offset="100%" stop-color="#fbe7d8"/>
    </linearGradient>
    <linearGradient id="gJudge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f1fb"/><stop offset="100%" stop-color="#e9e3f7"/>
    </linearGradient>
    <linearGradient id="gData" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6f7f9"/><stop offset="100%" stop-color="#eceff3"/>
    </linearGradient>
  </defs>

  <rect width="900" height="620" fill="#ffffff"/>

  <!-- browser -->
  <rect x="330" y="14" width="240" height="52" rx="10" fill="#ffffff" stroke="#c3ccd9" stroke-width="1.6"/>
  <text x="450" y="36" font-size="16" font-weight="600" fill="#2b3440" text-anchor="middle">用户浏览器</text>
  <text x="450" y="54" font-size="12" fill="#7a869a" text-anchor="middle">React SPA · TypeScript</text>
  <line x1="450" y1="66" x2="450" y2="92" stroke="#7a869a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="458" y="84" font-size="11" fill="#7a869a">HTTP</text>

  <!-- nginx -->
  <rect x="290" y="92" width="320" height="74" rx="10" fill="url(#gFrontend)" stroke="#9bb8dc" stroke-width="1.6"/>
  <text x="450" y="118" font-size="16" font-weight="600" fill="#22406b" text-anchor="middle">Nginx 反向代理</text>
  <text x="450" y="138" font-size="12" fill="#4a678f" text-anchor="middle">静态资源托管 · 唯一对外入口</text>
  <text x="450" y="155" font-size="11.5" fill="#5b7699" text-anchor="middle">/api/* → backend　　/agent/* → agentend</text>

  <!-- connectors from nginx -->
  <path d="M 400 166 L 400 190 L 250 190 L 250 214" fill="none" stroke="#7a869a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 500 166 L 500 190 L 650 190 L 650 214" fill="none" stroke="#7a869a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- backend -->
  <rect x="120" y="214" width="260" height="96" rx="10" fill="url(#gBackend)" stroke="#8fcfb0" stroke-width="1.6"/>
  <text x="250" y="242" font-size="16" font-weight="600" fill="#1f5e45" text-anchor="middle">backend</text>
  <text x="250" y="262" font-size="12" fill="#3d7f65" text-anchor="middle">Java · Spring Boot 3.2</text>
  <text x="250" y="283" font-size="11.5" fill="#4f8f77" text-anchor="middle">用户 / 题目 / 竞赛 / 班级 / 作业</text>
  <text x="250" y="300" font-size="11.5" fill="#4f8f77" text-anchor="middle">提交记录 · 权限 · 公告</text>

  <!-- agentend -->
  <rect x="520" y="214" width="260" height="96" rx="10" fill="url(#gAgent)" stroke="#e7b48c" stroke-width="1.6"/>
  <text x="650" y="242" font-size="16" font-weight="600" fill="#8a4b1c" text-anchor="middle">agentend</text>
  <text x="650" y="262" font-size="12" fill="#a8663a" text-anchor="middle">Python · FastAPI + Camel-AI</text>
  <text x="650" y="283" font-size="11.5" fill="#b5794c" text-anchor="middle">PEV Agent：Planner / Executor / Verifier</text>
  <text x="650" y="300" font-size="11.5" fill="#b5794c" text-anchor="middle">FAISS 向量 + BM25 混合检索 · 知识图谱</text>

  <!-- judgend -->
  <rect x="120" y="386" width="260" height="88" rx="10" fill="url(#gJudge)" stroke="#b9a8e0" stroke-width="1.6"/>
  <text x="250" y="414" font-size="16" font-weight="600" fill="#4c3a7d" text-anchor="middle">judgend</text>
  <text x="250" y="434" font-size="12" fill="#6b56a0" text-anchor="middle">Rust · Axum + Seccomp 沙箱</text>
  <text x="250" y="455" font-size="11.5" fill="#7c68ac" text-anchor="middle">编译 · 测试点执行 · 输出校验</text>
  <text x="250" y="469" font-size="11.5" fill="#7c68ac" text-anchor="middle">异步评测 · 结果回调 backend</text>

  <!-- connectors: backend -> judgend, backend -> mysql, agentend -> storage -->
  <path d="M 200 310 L 200 386" fill="none" stroke="#7a869a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 300 310 L 300 386" fill="none" stroke="#7a869a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 620 310 L 620 350 L 320 350 L 320 386" fill="none" stroke="#7a869a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="340" y="343" font-size="10.5" fill="#8a94a6">代码执行（实验性）</text>

  <!-- data layer -->
  <rect x="60" y="504" width="780" height="92" rx="10" fill="url(#gData)" stroke="#c3ccd9" stroke-width="1.6"/>
  <text x="76" y="524" font-size="12.5" font-weight="600" fill="#3b4757">数据存储层</text>

  <rect x="86" y="540" width="172" height="44" rx="7" fill="#ffffff" stroke="#b9c3d0" stroke-width="1.2"/>
  <text x="172" y="558" font-size="12.5" font-weight="600" fill="#3b4757" text-anchor="middle">MySQL 8.0</text>
  <text x="172" y="575" font-size="10.5" fill="#77839a" text-anchor="middle">业务数据</text>

  <rect x="274" y="540" width="172" height="44" rx="7" fill="#ffffff" stroke="#b9c3d0" stroke-width="1.2"/>
  <text x="360" y="558" font-size="12.5" font-weight="600" fill="#3b4757" text-anchor="middle">本地文件系统</text>
  <text x="360" y="575" font-size="10.5" fill="#77839a" text-anchor="middle">用户代码 · 测试数据</text>

  <rect x="462" y="540" width="172" height="44" rx="7" fill="#ffffff" stroke="#b9c3d0" stroke-width="1.2"/>
  <text x="548" y="558" font-size="12.5" font-weight="600" fill="#3b4757" text-anchor="middle">SQLite</text>
  <text x="548" y="575" font-size="10.5" fill="#77839a" text-anchor="middle">会话 · 消息 · 引用</text>

  <rect x="650" y="540" width="172" height="44" rx="7" fill="#ffffff" stroke="#b9c3d0" stroke-width="1.2"/>
  <text x="736" y="558" font-size="12.5" font-weight="600" fill="#3b4757" text-anchor="middle">FAISS Index</text>
  <text x="736" y="575" font-size="10.5" fill="#77839a" text-anchor="middle">文档向量 · 文本块</text>
  <!-- storage connectors: short arrows entering each store from above the layer -->
  <path d="M 172 486 L 172 540" fill="none" stroke="#aeb8c6" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M 360 486 L 360 540" fill="none" stroke="#aeb8c6" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M 548 486 L 548 540" fill="none" stroke="#aeb8c6" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M 736 486 L 736 540" fill="none" stroke="#aeb8c6" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- owner labels just above the storage layer -->
  <text x="172" y="502" font-size="10" fill="#9aa5b5" text-anchor="middle">backend</text>
  <text x="360" y="502" font-size="10" fill="#9aa5b5" text-anchor="middle">judgend</text>
  <text x="548" y="502" font-size="10" fill="#9aa5b5" text-anchor="middle">agentend</text>
  <text x="736" y="502" font-size="10" fill="#9aa5b5" text-anchor="middle">agentend</text>
</svg>
